<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SEO 数据看板</title><link rel="stylesheet" href="./style.css?v=gorganic1"></head>
<body><aside><div class="brand"><span>SEO</span> 数据看板</div><p class="aside-caption">站点表现与优化追踪</p><nav id="nav" aria-label="看板页面"></nav><div class="aside-bottom"><span class="dot"></span> 公开只读 · 管理员可编辑<p>历史数据按月保留</p></div></aside>
<main><header><div><p class="eyebrow" id="site-domain">加载站点中</p><h1 id="page-title">总览</h1></div><div class="actions"><button id="refresh">刷新</button><button id="export">导出快照</button><button id="login-toggle" class="primary">管理员登录</button></div></header>
<div class="filters"><label>站点<select id="site"></select></label><label>月份<input id="month" type="month" value="2026-10"></label><label class="search">搜索页面或关键词<input id="search" type="search" placeholder="输入关键词筛选当前页面"></label><span id="connection" role="status">正在连接数据库…</span></div>
<div id="notice" role="status"></div><section id="content" aria-live="polite"></section>
<footer>GSC 与 GA4 分别展示。自然流量包括自然搜索、自然购物、自然社交、自然视频和 AI 助手，已剔除确认的 Bing 广告。缺失数据以 — 表示，不代表 0。</footer></main>
<dialog id="login-dialog"><form id="login-form"><h2>管理员登录</h2><p>仅管理员需要登录。请使用已有的 Supabase 应用账号。</p><label>邮箱<input type="email" id="email" required autocomplete="username"></label><label>密码<input type="password" id="password" required autocomplete="current-password"></label><p id="login-message" role="status"></p><div class="actions"><button type="button" id="cancel-login">取消</button><button class="primary" type="submit">登录</button></div></form></dialog>
<script src="./config.js"></script><script src="./app.js?v=gorganic1"></script></body></html>
